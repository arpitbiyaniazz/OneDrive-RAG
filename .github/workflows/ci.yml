name: CI Pipeline - OneDrive RAG Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Evals
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onedrive_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database & pgvector
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/onedrive_rag
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/onedrive_rag
          DEV_MOCK_ONEDRIVE: "true"
        run: |
          python -m app.db.init_db

      - name: Run Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/onedrive_rag
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/onedrive_rag
          DEV_MOCK_ONEDRIVE: "true"
          TESTING: "1"
        run: |
          pytest tests/ -v

      - name: Run RAG Evaluation Benchmark
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/onedrive_rag
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/onedrive_rag
          DEV_MOCK_ONEDRIVE: "true"
        run: |
          python -m app.evals.run_evals v2

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and Build Bundle
        working-directory: frontend
        run: npm run build
