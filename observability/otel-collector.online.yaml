# OpenTelemetry Collector - gateway to a cloud APM.
# Only the debug exporter is active by default (the collector refuses to start when a configured
# exporter has no endpoint). Uncomment ONE exporter below, set its variables in
# docker-compose.online.yml's environment, and add it to the traces pipeline.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic
  # Honeycomb:
  # otlp/honeycomb:
  #   endpoint: "api.honeycomb.io:443"
  #   headers:
  #     "x-honeycomb-team": "${env:HONEYCOMB_API_KEY}"
  # Grafana Cloud Tempo:
  # otlp/grafana:
  #   endpoint: "${env:GRAFANA_TEMPO_ENDPOINT}"
  #   headers:
  #     "authorization": "Basic ${env:GRAFANA_TEMPO_AUTH}"
  # New Relic:
  # otlp/newrelic:
  #   endpoint: "otlp.nr-data.net:4317"
  #   headers:
  #     "api-key": "${env:NEW_RELIC_LICENSE_KEY}"
  # Any OTLP endpoint (Datadog, Dynatrace, ...):
  # otlp/cloud:
  #   endpoint: "${env:CLOUD_OTLP_ENDPOINT}"
  #   headers:
  #     "authorization": "${env:CLOUD_OTLP_AUTH_HEADER}"

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]  # e.g. [otlp/honeycomb, debug]
