# ==============================================================================
# Local observability stack (no cloud accounts needed)
#   backend --OTLP--> collector (localhost:4317/4318) --> Jaeger   http://localhost:16686
#                                                     \-> Prometheus http://localhost:9090
#   optional: self-hosted Langfuse http://localhost:3000 (with its own Postgres)
# Ports are bound to 127.0.0.1 only.
# ==============================================================================

services:
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: rag_observability_jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI (OTLP is received from the collector on the internal network)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - obs_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: rag_observability_collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.offline.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC from the backend
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:13133:13133" # health check
    depends_on:
      - jaeger
    networks:
      - obs_network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: rag_observability_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.offline.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - obs_network

  # Self-hosted Langfuse v2. It needs its OWN database: pointing it at the application database
  # would create Langfuse's tables (including `users`) next to the app's.
  langfuse-db:
    image: postgres:16-alpine
    container_name: rag_observability_langfuse_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    networks:
      - obs_network

  langfuse-local:
    image: langfuse/langfuse:2
    container_name: rag_observability_langfuse
    restart: unless-stopped
    depends_on:
      - langfuse-db
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      # Local development values only; never reuse them for a shared instance.
      - NEXTAUTH_SECRET=local-dev-langfuse-secret-32-chars-long!
      - SALT=local-dev-langfuse-salt-32-chars-long!
      - TELEMETRY_ENABLED=false
    networks:
      - obs_network

volumes:
  prometheus_data:
  langfuse_db:

networks:
  obs_network:
    name: rag_observability_network
    driver: bridge
