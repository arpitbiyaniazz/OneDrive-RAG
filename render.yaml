# Render Blueprint, free plan (DEPLOY.md option B): the API as a Docker web service and the web UI as a static
# site. The database is a free Neon Postgres: Render's own free Postgres is deleted after 30 days.
#
# BEFORE CREATING THE BLUEPRINT: replace "yourname" in this file (both service names and the CSP line below)
# with something unique to you, such as your GitHub username. Render addresses are global, so the API becomes
# https://rag-api-yourname.onrender.com and the UI https://rag-web-yourname.onrender.com.
#
# Values marked "sync: false" are asked for once, when you create the Blueprint in the Render dashboard.
# Free web services sleep after 15 minutes without traffic; the first request then takes about a minute.
services:
  - type: web
    name: rag-api-yourname
    runtime: docker
    plan: free
    region: singapore              # keep it in the same region as the Neon database
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      # The free instance has 512 MB of memory: one worker process, one file indexed at a time, files up to
      # 20 MB. The background job worker runs inside this process.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: INGEST_CONCURRENCY
        value: "1"
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      # How soon a queued indexing or sync job starts. Neon's compute stays on whenever the API is awake
      # (the job worker queries it every few seconds), so its free hours last only if the API sleeps.
      - key: WORKER_POLL_SECONDS
        value: "15"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Neon's DIRECT (not "-pooler") connection string, rewritten for asyncpg:
      #   postgresql+asyncpg://USER:PASSWORD@HOST/DBNAME?ssl=verify-full
      # (drop sslmode and channel_binding: asyncpg rejects them). verify-full checks Neon's certificate
      # against PGSSLROOTCERT below.
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT
        value: /etc/ssl/certs/ca-certificates.crt
      # The Google accounts that may sign in, comma-separated: you@gmail.com,colleague@gmail.com,@company.com
      - key: ALLOWED_EMAILS
        sync: false
      - key: LLM_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: ministral-8b-2512
      - key: EMBEDDING_PROVIDER
        value: mistral
      - key: EMBEDDING_MODEL
        value: mistral-embed
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: OCR_PROVIDER
        value: none
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER
        value: OneDrive-RAG
      # The UI's address: https://rag-web-yourname.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # https://rag-web-yourname.onrender.com/auth/google/callback (also an authorized redirect URI in Google Cloud)
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: DEV_MOCK_ONEDRIVE
        value: "false"
      - key: DEV_MOCK_GDRIVE
        value: "false"
      - key: OTEL_ENABLED
        value: "false"
      - key: LANGFUSE_ENABLED
        value: "false"

  - type: web
    name: rag-web-yourname
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      # The API's address plus /api: https://rag-api-yourname.onrender.com/api (built into the UI, so after
      # changing it use "Save, rebuild, and deploy").
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # The app's own pages (including the Google sign-in callback) are all index.html. Existing files
      # such as /assets/*.js are served as they are.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # connect-src must name the API's exact address (change it if Render gives the API another one).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://rag-api-yourname.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
